<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TikTok connection</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #111; }
  textarea { width: 100%; height: 110px; font-family: monospace; font-size: 13px; }
  button { margin-top: 10px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
  <h1>TikTok connection</h1>
  <div id="out">Waiting for TikTok…</div>
<script>
  const out = document.getElementById("out");
  const p = new URLSearchParams(location.search);
  if (p.get("error")) {
    out.innerHTML = '<p class="err">Authorization failed: ' +
      (p.get("error_description") || p.get("error")).replace(/</g, "&lt;") + "</p>";
  } else if (p.get("code")) {
    out.innerHTML =
      "<p>Approved. Copy this full URL and run:<br><code>python3 tiktok_pull.py exchange \"&lt;URL&gt;\"</code></p>" +
      '<textarea id="u" readonly></textarea><br><button id="c">Copy</button>' +
      "<p><small>The code expires within minutes and works once.</small></p>";
    const u = document.getElementById("u");
    u.value = location.href;
    document.getElementById("c").onclick = () => {
      u.select();
      navigator.clipboard ? navigator.clipboard.writeText(u.value) : document.execCommand("copy");
      document.getElementById("c").textContent = "Copied";
    };
  } else {
    out.textContent = "This page receives the TikTok approval code. Nothing to do here.";
  }
</script>
</body>
</html>
